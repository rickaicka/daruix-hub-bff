          type: integer
        business_segment_name:
          type: string
          readOnly: true
        company_type:
          type: integer
        company_type_name:
          type: string
          readOnly: true
        last_service:
          type: string
          maxLength: 180
        referred_by:
          type: string
          maxLength: 180
        website:
          type: string
          format: uri
          maxLength: 200
        notes:
          type: string
        converted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_active:
