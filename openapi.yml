openapi: 3.0.3
info:
  title: Daruix Hub API
  version: 1.0.0
  description: API interna do Daruix Hub
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates a SGOWEB user by username and password. First tries
        the Django database. If authentication fails, it can try the legacy Access
        authentication bridge.
      summary: Login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            examples:
              LoginRequest:
                value:
                  username: ricardo
                  password: '123456'
                summary: Login request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                SuccessfulLogin:
                  value:
                    access_token: jwt-access-token
                    refresh_token: jwt-refresh-token
                    token_type: bearer
                    usuario:
                      id_usuario: 1
                      username: ricardo
                      nome: Ricardo Salim Daruix
                      email: ricardo@daruix.com.br
                      tipo_usuario: COLABORADOR
                      grupo: DIRETORIA
                      permissoes:
                      - proposal.view
                      - purchase_order.approve
                  summary: Successful login
          description: ''
        '401':
          description: Invalid username or password.
        '403':
          description: User is inactive.
        '503':
          description: Legacy authentication unavailable.
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the provided refresh token.
      summary: Logout
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
            examples:
              LogoutRequest:
                value:
                  refresh_token: jwt-refresh-token
