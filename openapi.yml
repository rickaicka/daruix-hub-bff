components:
  schemas:
    ActionEnum:
      enum:
      - CRIADO
      - ALTERADO
      - ENVIADO
      - CANCELADO
      - REVISAO_CRIADA
      - ARQUIVO_ADICIONADO
      - ARQUIVO_REMOVIDO
      type: string
      description: |-
        * `CRIADO` - Criado
        * `ALTERADO` - Alterado
        * `ENVIADO` - Enviado
        * `CANCELADO` - Cancelado
        * `REVISAO_CRIADA` - Revisão criada
        * `ARQUIVO_ADICIONADO` - Arquivo adicionado
        * `ARQUIVO_REMOVIDO` - Arquivo removido
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label_display:
          type: string
          readOnly: true
        label:
          type: string
          maxLength: 80
        postal_code:
          type: string
          maxLength: 9
        street:
          type: string
          maxLength: 180
        number:
          type: string
          maxLength: 20
        complement:
          type: string
          maxLength: 120
        district:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 2
        is_primary:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        party:
          type: integer
      required:
      - city
      - created_at
      - district
      - id
      - label_display
      - number
      - party
      - postal_code
      - state
      - street
      - updated_at
    AdminChoiceOption:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
      required:
      - label
      - value
    AdminClient:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        user_name:
          type: string
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        client_group:
          $ref: '#/components/schemas/ClientGroupEnum'
        parent_client:
          type: integer
          nullable: true
          description: Board/origin client related to this operational client.
        trade_name:
          type: string
          nullable: true
          maxLength: 150
        legal_name:
          type: string
          nullable: true
          maxLength: 180
        document:
          type: string
          nullable: true
          maxLength: 20
        is_active:
          type: boolean
      required:
      - client_group
      - id
      - user
      - user_email
      - user_name
    AdminEmployee:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        user_name:
          type: string
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        employee_subgroup:
          $ref: '#/components/schemas/EmployeeSubgroupEnum'
        department:
          type: string
          nullable: true
          maxLength: 100
        position:
          type: string
          nullable: true
          maxLength: 100
        is_active:
          type: boolean
      required:
      - employee_subgroup
      - id
      - user
      - user_email
      - user_name
    AdminGroupPermission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        group:
          type: integer
        group_name:
          type: string
          readOnly: true
        group_user_type:
          type: string
          readOnly: true
        permission:
          type: integer
        permission_code:
          type: string
          readOnly: true
        permission_module:
          type: string
          readOnly: true
        is_active:
          type: boolean
      required:
      - group
      - group_name
      - group_user_type
      - id
      - permission
      - permission_code
      - permission_module
    AdminHubModule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nome
          maxLength: 120
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        route:
          type: string
          title: Rota
          description: 'Rota usada pelo Hub Shell. Exemplo: /financeiro'
          maxLength: 150
        icon:
          type: string
          title: Ícone
          description: 'Nome do ícone usado no front. Exemplo: dashboard, payments,
            engineering.'
          maxLength: 80
        permission:
          type: integer
          title: Permissão mínima de acesso
        permission_code:
          type: string
          readOnly: true
        permission_description:
          type: string
          readOnly: true
        desktop_enabled:
          type: boolean
          title: Disponível no desktop
        mobile_enabled:
          type: boolean
          title: Disponível no mobile
        mfe_enabled:
          type: boolean
          title: É MFE
        legacy_enabled:
          type: boolean
          title: É legado
        remote_name:
          type: string
          description: 'Nome do remote no Module Federation. Exemplo: financeiro'
          maxLength: 120
        remote_entry:
          type: string
          description: 'URL do remoteEntry.js. Exemplo: http://localhost:4304/remoteEntry.js'
          maxLength: 255
        exposed_module:
          type: string
          maxLength: 120
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Ordem
        is_active:
          type: boolean
          title: Ativo
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Atualizado em
      required:
      - created_at
      - id
      - name
      - permission
      - permission_code
      - permission_description
      - route
      - slug
      - updated_at
    AdminPermission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          description: 'Example: proposal.view, proposal.create, purchase_order.approve'
          maxLength: 100
        module:
          type: string
          description: 'Example: proposal, purchase_order, shipment_memo, rental'
          maxLength: 50
        description:
          type: string
          nullable: true
          maxLength: 255
        is_active:
          type: boolean
      required:
      - code
      - id
      - module
    AdminSupplier:
