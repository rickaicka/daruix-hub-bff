<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ativar acesso ao Daruix Hub</title><style>body{font:16px system-ui;background:#f5f6fa;color:#252831;padding:30px}main{max-width:450px;margin:5vh auto;background:white;border-radius:12px;padding:28px;box-shadow:0 2px 15px #ccd}input{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 20px}button{background:#c00d0e;color:white;border:0;border-radius:6px;padding:12px 20px}a{color:#c00d0e}</style></head><body><main><h1>Ativação do fornecedor</h1>{% if complete %}<p>Senha ativada com sucesso.</p><p>Seu usuário: <strong>{{ username }}</strong></p><a href="{{ hub_public_url }}/login">Entrar no Hub</a>{% else %}<p>Usuário: <strong>{{ username }}</strong></p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label>Nova senha<input type="password" name="password" autocomplete="new-password" required minlength="8"></label><label>Confirmar senha<input type="password" name="confirmation" autocomplete="new-password" required minlength="8"></label><button type="submit">Definir senha</button></form>{% endif %}</main></body></html>
