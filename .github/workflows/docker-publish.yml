
name: Build e Deploy - Daruix Hub BFF

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daruix-bff-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rickaicka/daruix-hub-bff

jobs:
  build-and-push:
    name: Build e publicacao GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Atualizar BFF na VPS
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Diagnosticar SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          echo "Fingerprint configurado:"
          printf '%s\n' "$VPS_FINGERPRINT"

          echo "Fingerprints apresentados pela VPS:"
          ssh-keyscan -T 10 -p 22 \
            -t ed25519,ecdsa,rsa "$VPS_HOST" 2>/dev/null \
            | ssh-keygen -lf - -E sha256

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          command_timeout: 10m
          script: |
            set -eu

            cd /opt/daruix-hub

            docker compose \
              -f compose.yml \
              -f compose.source.yml \
              pull bff

            docker compose \
              -f compose.yml \
              -f compose.source.yml \
              up -d --no-deps --force-recreate bff

            echo "Aguardando healthcheck..."

            for i in $(seq 1 30); do
              STATUS=$(docker inspect \
                -f '{{.State.Health.Status}}' \
                daruix-hub-bff)

              if [ "$STATUS" = "healthy" ]; then
                echo "BFF atualizado e saudavel"
                exit 0
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "BFF unhealthy"
                docker logs --tail=80 daruix-hub-bff
                exit 1
              fi

              sleep 5
            done

            echo "Timeout aguardando healthcheck"
            docker logs --tail=80 daruix-hub-bff
            exit 1
